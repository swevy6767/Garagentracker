<!doctype html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G-Tracker</title>
<meta name="description" content="G-Tracker – Verdienst-Tracker für die Schichten in der bluegarage Frauental.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="G-Tracker">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--sheet-bg:#F2F2F7;--sheet-card:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --grid:rgba(60,60,67,.12);--bar-mute:rgba(120,120,128,.3);
  --seg-on:#FFFFFF;--bar:rgba(249,249,249,.92);--alert-bg:rgba(242,242,242,.94);
  --blue:#007AFF;--blue-tint:rgba(0,122,255,.12);--green:#34C759;--red:#FF3B30;--orange:#FF9500;--teal:#30B0C7;--indigo:#5856D6;--gray:#8E8E93;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000;--card:#1C1C1E;--sheet-bg:#1C1C1E;--sheet-card:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);
  --grid:rgba(84,84,88,.45);--bar-mute:rgba(120,120,128,.45);
  --seg-on:#636366;--bar:rgba(22,22,22,.9);--alert-bg:rgba(44,44,46,.94);
  --blue:#0A84FF;--blue-tint:rgba(10,132,255,.18);--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--teal:#40C8E0;--indigo:#5E5CE6;--gray:#8E8E93;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--label);font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.41px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;letter-spacing:inherit}
svg.ic{width:22px;height:22px;flex:0 0 auto}
.num{font-variant-numeric:tabular-nums}

/* Views + nav */
.view{display:none;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.view.on{display:block}
.wrap{max-width:640px;margin:0 auto}
.nav{position:sticky;top:0;z-index:20;padding:env(safe-area-inset-top) 8px 0;transition:background-color .2s,box-shadow .2s}
.nav.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav-inner{max-width:640px;margin:0 auto;height:44px;display:flex;align-items:center;justify-content:space-between;position:relative}
.nav-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
.nav.scrolled .nav-title{opacity:1}
.nav-btn{color:var(--blue);height:44px;min-width:44px;padding:0 8px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:17px}
.nav-btn.strong{font-weight:600}
.nav-btn svg{width:24px;height:24px}
.nav-btn:active{opacity:.35}
.eyebrow{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px;margin:0 16px 0;padding-top:2px}
.eyebrow.solo{margin:2px 16px 12px}
.large-title{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:0 16px 14px}
.lt-row{display:flex;align-items:flex-end;justify-content:space-between;padding-right:8px}
.lt-row .large-title{margin-bottom:2px}
.arrows{display:flex;margin-bottom:2px}
.arrows button{width:44px;height:44px;color:var(--blue);display:flex;align-items:center;justify-content:center}
.arrows button:active{opacity:.35}
.subline{margin:0 16px 14px;font-size:15px;color:var(--label2)}
.subline b{color:var(--label);font-weight:600}

/* Cards + lists */
.card{background:var(--card);border-radius:12px;margin:0 16px 20px;overflow:hidden}
.sec-h{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px;margin:0 32px 7px;display:flex;justify-content:space-between;align-items:baseline}
.sec-h button{color:var(--blue);text-transform:none;font-size:15px;letter-spacing:-.24px}
.foot{font-size:13px;line-height:1.38;color:var(--label2);margin:-13px 32px 24px;letter-spacing:-.08px}
.list .row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px;width:100%;text-align:left;position:relative;background:var(--card)}
.list .row+.row::after{content:"";position:absolute;left:58px;right:0;top:0;height:.5px;background:var(--sep)}
.list.plain .row+.row::after{left:16px}
button.row:active{background:var(--fill2)}
.row .txt{flex:1;min-width:0}
.row .t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:14px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.15px;margin-top:1px}
.row .s.mono{font-family:var(--mono);font-size:13.5px;letter-spacing:0;color:var(--label)}
.row .v svg{width:20px;height:20px;display:block}
.row .nt{font-size:14px;color:var(--label3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.15px}
.row .amt{font-size:17px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .v{color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.pos{color:var(--green)}
.chev{width:8px;height:14px;color:var(--label3);flex:0 0 auto}
.badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.badge svg{width:17px;height:17px}
.sq{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.sq svg{width:18px;height:18px}
.list.settings .row{min-height:44px;padding:7px 16px}
.list.settings .row+.row::after{left:57px}
.bg-blue{background:var(--blue)}.bg-green{background:var(--green)}.bg-orange{background:var(--orange)}.bg-teal{background:var(--teal)}.bg-indigo{background:var(--indigo)}.bg-gray{background:var(--gray)}.bg-red{background:var(--red)}
.empty-row{padding:14px 16px;color:var(--label2);font-size:15px}

/* Hero */
.hero{padding:16px 16px 14px}
.hero-row{display:flex;justify-content:space-between;align-items:center}
.hero-label{font-size:15px;font-weight:600;color:var(--label2)}
.pill{font-size:13px;font-weight:600;color:var(--blue);background:var(--blue-tint);padding:3px 10px;border-radius:99px;white-space:nowrap}
.hero-amt{font-family:var(--round);font-size:48px;line-height:1.1;font-weight:700;letter-spacing:-.6px;margin:6px 0 3px}
.hero-meta{font-size:15px;color:var(--label2);letter-spacing:-.24px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;margin-top:18px;height:104px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:100%;max-width:24px;border-radius:4px 4px 0 0;background:var(--bar-mute);min-height:3px}
.bar.cur i{background:var(--blue)}
.bar b{font-size:11px;font-weight:600;color:var(--label2);font-variant-numeric:tabular-nums;height:13px;line-height:13px}
.bar.cur b{color:var(--label)}
.bar span{font-size:11px;color:var(--label2);height:13px;line-height:13px}
.bar:active i{opacity:.7}

/* Tiles + buttons */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px 24px}
.tile{background:var(--card);border-radius:12px;padding:12px 14px 13px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-width:0}
button.tile:active{opacity:.6}
.tile-top{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:4px}
.tile-label{font-size:15px;font-weight:600;color:var(--label2);letter-spacing:-.24px}
.tile-amt{font:700 24px/1.1 var(--round);letter-spacing:-.3px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tile-sub{font-size:13px;color:var(--label2);letter-spacing:-.08px}
.btn-wrap{margin:0 16px 24px}
.btn{height:50px;width:100%;border-radius:12px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:20px;height:20px}
.btn.tinted{background:var(--blue-tint);color:var(--blue)}
.btn.filled{background:var(--blue);color:#fff}
.btn.red{background:var(--card);color:var(--red);font-weight:400}
.btn:active{opacity:.6}

/* Hint + welcome */
.hint{display:flex;gap:12px;padding:14px 12px 14px 16px;align-items:flex-start}
.hint .txt{flex:1;font-size:15px;line-height:1.33;letter-spacing:-.24px}
.hint .txt b{display:block;font-size:17px;margin-bottom:2px;letter-spacing:-.41px}
.hint .txt span{color:var(--label2)}
.hint .x{width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--label2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.hint .x svg{width:14px;height:14px}
.welcome{padding:26px 20px 20px;text-align:center}
.welcome .badge{width:56px;height:56px;margin:0 auto 12px}
.welcome .badge svg{width:30px;height:30px}
.welcome h3{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:.38px}
.welcome p{margin:0 0 18px;color:var(--label2);font-size:15px;letter-spacing:-.24px}
.sync-line{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--label2);margin:0 16px 20px;letter-spacing:-.08px}
.sync-line svg{width:17px;height:17px}
.st-ok{color:var(--green)}.st-pending{color:var(--blue)}.st-offline,.st-error{color:var(--orange)}.st-off,.st-idle{color:var(--gray)}

/* Calendar */
.cal-card{padding:6px 6px 8px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:13px;color:var(--label2);text-align:center;font-weight:600;padding:6px 0 4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.day{display:flex;flex-direction:column;align-items:center;height:58px;padding-top:3px;border-radius:10px}
.day .n{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:0}
.day.we .n{color:var(--label2)}
.day.today .n{color:var(--red);font-weight:600}
.day.sel .n{background:var(--label);color:var(--card);font-weight:600}
.day.sel.today .n{background:var(--red);color:#fff}
.day .a{font-size:11px;line-height:13px;height:13px;margin-top:3px;color:var(--green);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.2px;white-space:nowrap}
.day.out{visibility:hidden}

/* Statistik */
.seg-row{margin:0 16px 16px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:500;letter-spacing:-.15px;transition:background-color .15s}
.seg button.on{background:var(--seg-on);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.sd{padding:14px 16px 0}
.sd-t{font-size:15px;font-weight:600;color:var(--label2)}
.sd-v{font:700 34px/1.15 var(--round);letter-spacing:-.4px;margin-top:2px}
.sd-d{font-size:14px;margin-top:3px;display:flex;align-items:center;gap:5px;color:var(--label2);min-height:18px;letter-spacing:-.15px}
.sd-d svg{width:14px;height:14px}
.sd-d .dv{font-weight:600}
.sd-d.up .dv,.sd-d.up svg{color:var(--green)}
.sd-d.down .dv,.sd-d.down svg{color:var(--red)}
.chart-wrap{padding:0 12px 12px 16px}
.chart{padding-top:22px}
.plot{position:relative}
.gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--grid)}
.gl span{position:absolute;right:0;top:-8px;font-size:11px;line-height:15px;color:var(--label2);padding-left:6px;background:var(--card);font-variant-numeric:tabular-nums;letter-spacing:0}
.cols{position:absolute;left:0;right:38px;top:0;bottom:0;display:flex}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;position:relative;border-radius:6px}
.col i{display:block;width:min(22px,64%);border-radius:4px 4px 0 0;background:var(--bar-mute);transition:height .35s cubic-bezier(.32,.72,0,1)}
.col.sel i{background:var(--blue)}
.col b{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;line-height:14px;font-weight:600;color:var(--label);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:0}
.col:active i{opacity:.7}
.col:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.xl{display:flex;margin:6px 38px 0 0}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--label2);white-space:nowrap;min-width:0;letter-spacing:0}
.xl span.on{color:var(--label);font-weight:600}
.mini{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
.mini div{padding:10px 16px;position:relative}
.mini div:nth-child(even)::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:.5px;background:var(--sep)}
.mini div:nth-child(n+3){border-top:.5px solid var(--sep)}
.mini span{display:block;font-size:13px;color:var(--label2);letter-spacing:-.08px}
.mini b{font-size:17px;font-weight:600}
.wd-cap{padding:14px 16px 0;font-size:15px;color:var(--label2);letter-spacing:-.24px}
.wd-cap b{color:var(--label);font-weight:600}
.meter-card{padding:14px 16px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline}
.meter-top b{font:700 22px/1.1 var(--round)}
.meter{height:8px;border-radius:4px;background:var(--blue-tint);margin:10px 0 8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.meter-sub{font-size:13px;color:var(--label2);letter-spacing:-.08px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:max(4px,env(safe-area-inset-bottom))}
.tabbar-in{max-width:640px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:50px;padding-top:3px;font-size:10px;font-weight:500;color:var(--gray);letter-spacing:.1px}
.tab svg{width:27px;height:27px}
.tab.on{color:var(--blue)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 12px);z-index:51;max-width:640px;margin:0 auto;background:var(--sheet-bg);border-radius:12px 12px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .42s cubic-bezier(.32,.72,0,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0;flex:0 0 auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;height:50px;padding:0 8px;flex:0 0 auto;position:relative}
.sheet-title{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;white-space:nowrap}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 0 calc(40px + env(safe-area-inset-bottom))}
.amount-big{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:16px 16px 4px}
.amount-big .cur{font:600 34px/1 var(--round);color:var(--label2)}
.amount-big input{font:700 56px/1.15 var(--round);letter-spacing:-.5px;border:0;background:transparent;color:var(--label);width:1.3ch;min-width:1.3ch;max-width:80%;text-align:left;outline:none;caret-color:var(--blue);padding:0;font-variant-numeric:tabular-nums}
.amount-big input::placeholder{color:var(--label3)}
.amount-cap{text-align:center;color:var(--label2);font-size:15px;margin:0 0 22px;letter-spacing:-.24px}
.group{background:var(--sheet-card);border-radius:12px;margin:0 16px 20px;overflow:hidden}
.group>*{position:relative}
.group>*+*::after{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.f-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:0 16px}
.f-row label{white-space:nowrap}
.f-row input{flex:1;min-width:0;text-align:right;border:0;background:transparent;font:inherit;font-size:17px;color:var(--label);outline:none;padding:12px 0;letter-spacing:-.41px}
.f-row input::placeholder{color:var(--label3)}
.f-row input[type=date]{flex:0 0 auto;-webkit-appearance:none;appearance:none;background:var(--fill);border-radius:8px;padding:6px 11px;min-height:34px;min-width:128px;text-align:center;color:var(--label)}
.f-row input[type=date]::-webkit-date-and-time-value{text-align:center}
.f-row input.code{text-align:left;font-family:var(--mono);letter-spacing:.5px}
textarea{display:block;width:100%;border:0;background:transparent;font:inherit;font-size:17px;color:var(--label);resize:none;outline:none;min-height:88px;padding:12px 16px;letter-spacing:-.41px}
textarea::placeholder{color:var(--label3)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.steps{margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;position:relative}
.steps li+li::after{content:"";position:absolute;left:52px;right:0;top:0;height:.5px;background:var(--sep)}
.steps .no{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:-1px}

/* Alert + toast */
.alert-wrap{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.alert-wrap.on{display:flex}
.alert{width:270px;background:var(--alert-bg);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;text-align:center;overflow:hidden;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(1.15);opacity:0}}
.alert-t{font-weight:600;font-size:17px;padding:19px 16px 3px}
.alert-m{font-size:13px;line-height:1.35;padding:0 16px 19px;letter-spacing:-.08px}
.alert-b{display:flex;box-shadow:0 -.5px 0 var(--sep)}
.alert-b button{flex:1;height:44px;color:var(--blue);font-size:17px}
.alert-b button+button{box-shadow:-.5px 0 0 var(--sep)}
.alert-b .strong{font-weight:600}
.alert-b .red{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:rgba(30,30,30,.92);color:#fff;font-size:15px;font-weight:600;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;white-space:nowrap;display:flex;align-items:center;gap:7px}
.toast svg{width:18px;height:18px;color:var(--green)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.meta-foot{text-align:center;font-size:13px;color:var(--label3);margin:4px 16px 20px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px 24px}
.btn.gray{background:var(--fill);color:var(--label)}
.today-card{padding:14px 16px 16px}
.today-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.today-top .txt{flex:1;min-width:0}
.today-top .badge svg{width:22px;height:22px}
.today-top b{display:block;font-size:20px;font-weight:700;letter-spacing:.38px}
.today-top .txt span{display:block;font-size:15px;color:var(--label2);letter-spacing:-.24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .pl{display:block;width:6px;height:6px;border-radius:50%;background:var(--indigo);margin:6px auto 1px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:0 0 auto;transition:background-color .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.sw.dis{opacity:.45}
.f-row input[type=time]{flex:0 0 auto;-webkit-appearance:none;appearance:none;background:var(--fill);border-radius:8px;padding:6px 11px;min-height:34px;min-width:90px;text-align:center;color:var(--label)}
.rem-row{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:15px;letter-spacing:-.24px}
.rem-row .txt{flex:1;color:var(--label2)}
.rem-row button{color:var(--blue);font-weight:600}
</style>

<script>
(function(){
'use strict';
var KEY='bluegarage-verdienst-v1', SKEY='g-tracker-sync', VERSION='1.2';
var $=function(s){return document.querySelector(s)};

/* ---------- Helpers ---------- */
var LOC='de-AT';
var fEur=new Intl.NumberFormat(LOC,{style:'currency',currency:'EUR'});
var fNum=new Intl.NumberFormat(LOC,{maximumFractionDigits:2});
var fInt=new Intl.NumberFormat(LOC,{maximumFractionDigits:0});
var fMonth=new Intl.DateTimeFormat(LOC,{month:'long'});
var fMonthShort=new Intl.DateTimeFormat(LOC,{month:'short'});
var fDayLong=new Intl.DateTimeFormat(LOC,{weekday:'long',day:'numeric',month:'long'});
var fDayShort=new Intl.DateTimeFormat(LOC,{weekday:'short',day:'numeric',month:'short'});
var fDM=new Intl.DateTimeFormat(LOC,{day:'numeric',month:'short'});
var fTime=new Intl.DateTimeFormat(LOC,{hour:'2-digit',minute:'2-digit'});
var WD=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
function eur(n){return fEur.format(Math.round((n||0)*100)/100)}
function r2(n){return Math.round(n*100)/100}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)}
function todayStr(){return ymd(new Date())}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function parseNum(v){
  var s=String(v==null?'':v).replace(/\s|€/g,'');if(!s)return 0;
  if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');
  var n=parseFloat(s);return isFinite(n)?r2(Math.abs(n)):0;
}
function inputVal(n,money){if(!n)return'';return(money&&!Number.isInteger(+n)?(+n).toFixed(2):String(n)).replace('.',',')}
function shortEur(v){v=Math.round(v);return v>=10000?(Math.round(v/100)/10).toString().replace('.',',')+'k':v+'€'}
function monthShort(d){return fMonthShort.format(d).replace('.','')}
function monthTitle(d){return fMonth.format(d)+' '+d.getFullYear()}
function earned(e){return(+e.amount||0)+(+e.tip||0)}
function sortDesc(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.created||0)-(a.created||0)}
function plural(n,one,many){return n+' '+(n===1?one:many)}

/* ---------- Storage (local first) ---------- */
function clean(e){
  if(!e||typeof e.id!=='string')return null;
  var u=+e.u||+e.created||0;
  if(e.del)return{id:e.id,del:true,u:u};
  if(typeof e.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))return null;
  if(e.kind==='plan')return{id:e.id,kind:'plan',date:e.date,time:typeof e.time==='string'&&/^\d{2}:\d{2}$/.test(e.time)?e.time:'',note:typeof e.note==='string'?e.note:'',created:+e.created||u,u:u};
  return{id:e.id,date:e.date,amount:+e.amount||0,tip:+e.tip||0,hours:+e.hours||0,note:typeof e.note==='string'?e.note:'',created:+e.created||u,u:u};
}
function cleanList(l){return(Array.isArray(l)?l:[]).map(clean).filter(Boolean)}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);return{entries:cleanList(d.entries),prefs:d.prefs||{}}}}catch(e){}
  return{entries:[],prefs:{}};
}
var db=load();
function live(){return db.entries.filter(function(e){return!e.del&&e.kind!=='plan'})}
function plans(){return db.entries.filter(function(e){return!e.del&&e.kind==='plan'})}
function allLive(){return db.entries.filter(function(e){return!e.del})}
function planSort(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.time||'99')<(b.time||'99')?-1:1}
function planSub(pl){return(pl.time?'ab '+pl.time+' Uhr':'Geplant')+(pl.note?' · '+pl.note:'')}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify({v:2,entries:db.entries,prefs:db.prefs}));return true}catch(e){toast('Speichern am Handy fehlgeschlagen',true);return false}}
function save(){var ok=saveLocal();if(ok){sync.gen++;sync.dirty=true;saveSync();schedulePush()}return ok}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}

function mergeEntries(a,b){
  var m={},order=[];
  a.concat(b).forEach(function(e){if(!e)return;var c=m[e.id];if(!c)order.push(e.id);if(!c||(e.u||0)>(c.u||0)||((e.u||0)===(c.u||0)&&e.del&&!c.del))m[e.id]=e});
  return order.map(function(id){return m[id]});
}
function sig(list){return list.map(function(e){return e.id+':'+(e.u||0)+(e.del?'d':'')}).sort().join('|')}

/* ---------- Cloud sync ---------- */
function genId(){var abc='abcdefghijkmnpqrstuvwxyz23456789',a=new Uint8Array(20),s='';crypto.getRandomValues(a);for(var i=0;i<20;i++)s+=abc[a[i]%32];return s}
function fmtCode(c){return String(c).replace(/(.{4})(?=.)/g,'$1-')}
function normCode(c){return String(c||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function loadSync(){
  try{var s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&s.id)return{id:s.id,last:s.last||0,dirty:!!s.dirty,state:'idle',gen:0}}catch(e){}
  return{id:genId(),last:0,dirty:true,state:'idle',gen:0};
}
var sync=loadSync();
function saveSync(){try{localStorage.setItem(SKEY,JSON.stringify({id:sync.id,last:sync.last,dirty:sync.dirty}))}catch(e){}}
saveSync();
var pushT=null,busy=false,lastPull=0;
function schedulePush(ms){clearTimeout(pushT);pushT=setTimeout(push,ms==null?1200:ms)}
function api(method,body){
  var o={method:method,cache:'no-store',headers:{}};
  if(method==='GET')o.headers['x-sync-id']=sync.id;else{o.headers['content-type']='application/json';o.body=JSON.stringify(body)}
  return fetch('/api/sync',o).then(function(r){return r.json().catch(function(){return{}}).then(function(j){j.__s=r.status;return j})});
}
function failState(){setState(navigator.onLine===false?'offline':'error')}
function applyRemote(list){
  var before=sig(db.entries);
  db.entries=mergeEntries(db.entries,cleanList(list));
  if(sig(db.entries)!==before){saveLocal();render()}
}
function remoteMissesLocal(remote){
  var m={};remote.forEach(function(e){m[e.id]=e});
  return db.entries.some(function(e){var r=m[e.id];return!r||(r.u||0)<(e.u||0)||(!!e.del&&!r.del)});
}
function push(){
  clearTimeout(pushT);
  if(busy){schedulePush(800);return}
  busy=true;var sentGen=sync.gen;if(sync.state!=='ok'||sync.dirty)setState('pending');
  api('POST',{id:sync.id,entries:db.entries}).then(function(j){
    busy=false;
    if(j.__s===503){setState('off');return}
    if(j.__s!==200||!Array.isArray(j.entries)){failState();schedulePush(30000);return}
    applyRemote(j.entries);
    if(sync.gen===sentGen)sync.dirty=false;
    sync.last=Date.now();saveSync();setState('ok');
    if(sync.dirty)schedulePush(300);
  }).catch(function(){busy=false;failState();schedulePush(30000)});
}
function pull(){
  lastPull=Date.now();
  api('GET').then(function(j){
    if(j.__s===503){setState('off');return}
    if(j.__s!==200||!Array.isArray(j.entries)){failState();if(sync.dirty)schedulePush(30000);return}
    var remote=cleanList(j.entries),need=remoteMissesLocal(remote);
    applyRemote(remote);
    if(need||sync.dirty)push();else{sync.last=Date.now();saveSync();setState('ok')}
  }).catch(function(){failState();if(sync.dirty)schedulePush(30000)});
}
function setState(s){sync.state=s;renderSyncBits()}
var CLOUD='<path d="M7 18.5h10.5a4 4 0 0 0 .7-7.94A6 6 0 0 0 6.6 9.3 4.6 4.6 0 0 0 7 18.5z"/>';
function syncText(){
  switch(sync.state){
    case'ok':return'In der Cloud gesichert · '+fTime.format(new Date(sync.last));
    case'pending':return'Wird gesichert …';
    case'offline':return'Offline – wird automatisch nachgeholt';
    case'error':return'Sichern hat nicht geklappt – neuer Versuch läuft';
    case'off':return'Cloud noch nicht eingerichtet – nur am Handy gespeichert';
    default:return'Verbinde mit der Cloud …';
  }
}
function renderSyncBits(){
  var l=$('#sync-line');if(l)l.innerHTML='<span class="st-'+sync.state+'">'+ic('cloud')+'</span><span>'+esc(syncText())+'</span>';
  var s=$('#sync-status');if(s)s.innerHTML=syncStatusRow();
}

/* ---------- Icons ---------- */
var P={
  music:'<path d="M9 18V6.5l11-2.5v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  up:'<path d="M12 15V3.5M7.5 8L12 3.5 16.5 8"/><path d="M5 11.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7.5"/>',
  down:'<path d="M12 3.5V15M7.5 10.5L12 15l4.5-4.5"/><path d="M5 11.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7.5"/>',
  table:'<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/>',
  phone:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M10.5 18.5h3"/>',
  trash:'<path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  left:'<path d="M15 4.5L7.5 12l7.5 7.5"/>',
  right:'<path d="M9 4.5l7.5 7.5L9 19.5"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  share:'<path d="M12 14V3.5M8 7.5l4-4 4 4"/><path d="M8.5 10.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.5a2 2 0 0 0-2-2h-1.5"/>',
  cloud:CLOUD,
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2.5 2.5M14 9l2 2"/>',
  link:'<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/>',
  sync:'<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20.5V16h-4.5"/>',
  arrowUp:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  arrowDown:'<path d="M12 5v14M6 13l6 6 6-6"/>',
  copy:'<rect x="8.5" y="8.5" width="11" height="12" rx="2.2"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/>',
  bell:'<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M12 12.5v5M9.5 15h5"/>',
  star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>'
};
function ic(n,sw){return'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>'}
var CHEV='<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg>';

/* ---------- Rows ---------- */
function entrySub(e){
  var p=[];
  if(+e.hours)p.push(fNum.format(e.hours)+' h');
  if(+e.tip)p.push('Trinkgeld '+eur(e.tip));
  return p.length?p.join(' · '):'Schicht';
}
function planRow(x,withDate){
  return'<button class="row" data-act="plan-edit" data-id="'+esc(x.id)+'"><span class="badge bg-indigo">'+ic('cal')+'</span><span class="txt"><div class="t">'+(withDate?esc(fDayShort.format(parseYmd(x.date))):'Geplante Schicht')+'</div><div class="s">'+esc(planSub(x))+'</div></span>'+(pushOn()?'<span class="v" style="color:var(--indigo)">'+ic('bell')+'</span>':'')+CHEV+'</button>';
}
function entryRow(e,withDate){
  return'<button class="row" data-act="edit" data-id="'+esc(e.id)+'"><span class="badge bg-blue">'+ic('music')+'</span><span class="txt"><div class="t">'+(withDate?esc(fDayShort.format(parseYmd(e.date))):'Schicht')+'</div><div class="s">'+esc(entrySub(e))+'</div>'+(e.note?'<div class="nt">'+esc(e.note)+'</div>':'')+'</span><span class="amt pos">+'+eur(earned(e))+'</span>'+CHEV+'</button>';
}

/* ---------- Periods (Woche / Monat / Jahr) ---------- */
function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function keyOf(ds,g){if(g==='month')return ds.slice(0,7);if(g==='year')return ds.slice(0,4);return ymd(mondayOf(parseYmd(ds)))}
function curKey(g){return keyOf(todayStr(),g)}
function shiftKey(k,g,n){
  if(g==='month'){var p=k.split('-');return ymd(new Date(+p[0],+p[1]-1+n,1)).slice(0,7)}
  if(g==='year')return String(+k+n);
  var d=parseYmd(k);d.setDate(d.getDate()+7*n);return ymd(d);
}
function periodKeys(g){
  var cur=curKey(g),out=[],i;
  if(g==='year'){
    var minY=+cur-2;live().forEach(function(e){var y=+e.date.slice(0,4);if(y<minY)minY=y});
    for(i=Math.max(minY,+cur-5);i<=+cur;i++)out.push(String(i));return out;
  }
  var n=g==='month'?12:10;for(i=n-1;i>=0;i--)out.push(shiftKey(cur,g,-i));return out;
}
function aggregate(g){
  var m={};
  live().forEach(function(e){var k=keyOf(e.date,g),s=m[k]||(m[k]={sum:0,tips:0,hours:0,count:0});s.sum+=earned(e);s.tips+=+e.tip||0;s.hours+=+e.hours||0;s.count++});
  return m;
}
function pLabel(k,g){if(g==='month')return monthShort(parseYmd(k+'-01'));if(g==='year')return k;var d=parseYmd(k);return d.getDate()+'.'+(d.getMonth()+1)+'.'}
function pTitle(k,g){
  if(g==='month')return monthTitle(parseYmd(k+'-01'));
  if(g==='year')return'Jahr '+k;
  var a=parseYmd(k),b=new Date(a);b.setDate(b.getDate()+6);return fDM.format(a)+' – '+fDM.format(b);
}
function prevName(k,g){if(g==='month')return'ggü. '+fMonth.format(parseYmd(shiftKey(k,g,-1)+'-01'));if(g==='year')return'ggü. '+shiftKey(k,g,-1);return'ggü. Vorwoche'}
var EMPTY={sum:0,tips:0,hours:0,count:0};

/* ---------- Chart (single series, emphasis on the selected bar) ---------- */
function niceScale(max){
  if(!(max>0))return{top:100,ticks:[0,50,100]};
  var rough=max/3,mag=Math.pow(10,Math.floor(Math.log10(rough))),step=mag;
  [1,2,2.5,5,10].some(function(m){if(m*mag>=rough){step=m*mag;return true}return false});
  var top=step*Math.ceil(max/step),ticks=[];for(var t=0;t<=top+1e-9;t+=step)ticks.push(r2(t));
  return{top:top,ticks:ticks};
}
function fmtTick(t){return t>=1000?fNum.format(t/1000)+'k':fInt.format(t)}
function barChart(o){
  var H=o.height||150,max=0;o.items.forEach(function(it){if(it.v>max)max=it.v});
  var sc=niceScale(max),h='<div class="chart"><div class="plot" style="height:'+H+'px">';
  sc.ticks.forEach(function(t){h+='<div class="gl" style="bottom:'+(t/sc.top*100)+'%"><span>'+fmtTick(t)+'</span></div>'});
  h+='<div class="cols">';
  o.items.forEach(function(it){
    var px=it.v>0?Math.max(3,Math.round(it.v/sc.top*H)):0,on=it.k===o.sel;
    h+='<button class="col'+(on?' sel':'')+'" data-act="'+o.act+'" data-k="'+esc(it.k)+'" aria-pressed="'+on+'" aria-label="'+esc(it.aria)+'">'+(on&&it.v>0?'<b style="bottom:'+(px+3)+'px">'+esc(it.cap)+'</b>':'')+'<i style="height:'+px+'px"></i></button>';
  });
  h+='</div></div><div class="xl">';
  o.items.forEach(function(it){h+='<span'+(it.k===o.sel?' class="on"':'')+'>'+esc(it.label)+'</span>'});
  return h+'</div></div>';

/* ---------- Calendar ---------- */
function renderCal(){
  var y=cal.y,m=cal.m,first=new Date(y,m,1),dim=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7;
  var mk=y+'-'+pad(m+1),ms=aggregate('month')[mk]||EMPTY,map={},t=todayStr(),all=live();
  all.forEach(function(e){if(e.date.slice(0,7)===mk)map[e.date]=(map[e.date]||0)+earned(e)});
  var pmap={};plans().forEach(function(x){if(x.date.slice(0,7)===mk)pmap[x.date]=true});
  var mName=fMonth.format(first);
  $('#cal-navtitle').textContent=mName+' '+y;
  var h='<div class="lt-row"><div><div class="eyebrow">'+y+'</div><h1 class="large-title">'+esc(mName)+'</h1></div><div class="arrows"><button data-act="prev" aria-label="Voriger Monat">'+ic('left',2.4)+'</button><button data-act="next" aria-label="Nächster Monat">'+ic('right',2.4)+'</button></div></div>';
  h+='<div class="subline"><b class="num">'+eur(ms.sum)+'</b> · '+plural(ms.count,'Schicht','Schichten')+(ms.hours?' · '+fNum.format(ms.hours)+' h':'')+'</div>';
  h+='<div class="card cal-card" id="cal-card"><div class="cal-wd"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div><div class="cal-grid">';
  for(var i=0;i<off;i++)h+='<div class="day out"></div>';
  for(var d=1;d<=dim;d++){
    var ds=mk+'-'+pad(d),v=map[ds],wd=(off+d-1)%7;
    h+='<button class="day'+(wd>4?' we':'')+(ds===t?' today':'')+(ds===selDay?' sel':'')+'" data-act="day" data-d="'+ds+'"><span class="n">'+d+'</span>'+(v?'<span class="a">'+shortEur(v)+'</span>':pmap[ds]?'<span class="pl" aria-label="geplant"></span>':'<span class="a"></span>')+'</button>';
  }
  h+='</div></div>';
  if(selDay&&selDay.slice(0,7)===mk){
    var dayE=all.filter(function(e){return e.date===selDay}).sort(sortDesc),dayP=plans().filter(function(x){return x.date===selDay}).sort(planSort);
    h+='<div class="sec-h">'+esc(fDayLong.format(parseYmd(selDay)))+'</div><div class="card list">';
    if(!dayE.length&&!dayP.length)h+='<div class="empty-row">'+(selDay>=t?'Noch nix geplant.':'Keine Schicht an dem Tag.')+'</div>';
    dayP.forEach(function(x){h+=planRow(x,false)});
    dayE.forEach(function(e){h+=entryRow(e,false)});
    var plus='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    h+='</div>'+(selDay>=t?'<div class="btn-row"><button class="btn tinted" data-act="add-day">'+plus+'Verdienst</button><button class="btn gray" data-act="plan-day">'+ic('cal')+'Planen</button></div>':'<div class="btn-wrap"><button class="btn tinted" data-act="add-day">'+plus+'Schicht eintragen</button></div>');
  }
  var monthE=all.filter(function(e){return e.date.slice(0,7)===mk}).sort(sortDesc);
  if(monthE.length){
    h+='<div class="sec-h">Alle Schichten im '+esc(mName)+'</div><div class="card list">';
    monthE.forEach(function(e){h+=entryRow(e,true)});
    h+='</div>';
  }
  $('#cal').innerHTML=h;
}
function shiftMonth(dir){
  var d=new Date(cal.y,cal.m+dir,1);cal={y:d.getFullYear(),m:d.getMonth()};
  var n=new Date();selDay=(cal.y===n.getFullYear()&&cal.m===n.getMonth())?todayStr():ymd(d);

}

  // totals

    '<div class="tile"><span class="tile-label">Ø pro Schicht</span><span class="tile-amt">'+eur(tot/all.length)+'</span><span class="tile-sub">'+(hrs?'Ø '+eur(hrsEarned/hrs)+'/h':'ohne Stunden')+'</span></div>'+
  '</div>';
  var share=tot>0?Math.round(tips/tot*100):0;

  h+='</div>';
  $('#stats').innerHTML=h;

/* ---------- Tabs + nav ---------- */
function setTab(t){
  if(t===tab){window.scrollTo({top:0,behavior:'smooth'});return}
  tab=t;
  document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id==='v-'+t)});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t)});
  window.scrollTo(0,0);updateNav();
}
function updateNav(){var sc=window.scrollY>36;document.querySelectorAll('.nav').forEach(function(n){n.classList.toggle('scrolled',sc)})}
window.addEventListener('scroll',updateNav,{passive:true});

/* ---------- Sheet ---------- */
var sheetEl=$('#sheet'),backEl=$('#backdrop'),sheetOpts=null,lockY=0,sheetOpen=false;
function lockScroll(){lockY=window.scrollY;document.body.style.position='fixed';document.body.style.top=-lockY+'px';document.body.style.left='0';document.body.style.right='0'}
function unlockScroll(){document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';window.scrollTo(0,lockY)}
function openSheet(o){
  sheetOpts=o;
  sheetEl.innerHTML='<div class="grabber"></div><div class="sheet-head"><button class="nav-btn" data-sh="cancel">'+(o.noSave?'':'Abbrechen')+'</button><div class="sheet-title">'+esc(o.title)+'</div>'+(o.noSave?'<button class="nav-btn strong" data-sh="cancel">Fertig</button>':'<button class="nav-btn strong" data-sh="save">'+(o.saveLabel||'Sichern')+'</button>')+'</div><div class="sheet-body">'+o.body+'</div>';
  if(!sheetOpen){lockScroll();sheetOpen=true}
  if(o.mount)o.mount(sheetEl);
  void sheetEl.offsetHeight;
  backEl.classList.add('on');sheetEl.classList.add('on');
}
function closeSheet(){
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  backEl.classList.remove('on');sheetEl.classList.remove('on');sheetOpts=null;if(sheetOpen){sheetOpen=false;unlockScroll()}
}
sheetEl.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-sh]');
  if(b){if(b.dataset.sh==='cancel')closeSheet();else if(b.dataset.sh==='save'&&sheetOpts&&sheetOpts.save)sheetOpts.save(sheetEl);return}
  var a=ev.target.closest('[data-sh-act]');
  if(a&&sheetOpts&&sheetOpts.action)sheetOpts.action(a.dataset.shAct);
});
backEl.addEventListener('click',closeSheet);
(function(){var sy=null;sheetEl.addEventListener('touchstart',function(e){sy=e.target.closest('.sheet-head,.grabber')?e.touches[0].clientY:null},{passive:true});
sheetEl.addEventListener('touchend',function(e){if(sy!==null&&e.changedTouches[0].clientY-sy>70)closeSheet();sy=null},{passive:true})})();

function sizeAmount(inp){var l=(inp.value||inp.placeholder||'0').length;inp.style.width=(l+0.3)+'ch'}
function bindAmount(el){
  var inp=el.querySelector('#f-amount');if(!inp)return;
  sizeAmount(inp);
  inp.addEventListener('input',function(){inp.value=inp.value.replace(/[^0-9.,]/g,'');sizeAmount(inp)});
  el.querySelector('.amount-big').addEventListener('click',function(){inp.focus()});
}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}

/* ---------- Entry sheet ---------- */
function findEntry(id){return db.entries.find(function(x){return x.id===id&&!x.del})}
function openEntry(id,date,fromPlan){
  var e=id?findEntry(id):null;
  if(id&&!e)return;
  var d=e||{date:fromPlan?fromPlan.date:(date||todayStr()),amount:0,tip:0,hours:0,note:fromPlan?fromPlan.note:''};
  var body='<div class="amount-big"><span class="cur">€</span><input id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(inputVal(d.amount,1))+'" aria-label="Verdienst in Euro"></div><div class="amount-cap">Verdienst (ohne Trinkgeld)</div>'+
    '<div class="group">'+
      '<div class="f-row"><label for="f-date">Datum</label><input type="date" id="f-date" value="'+esc(d.date)+'"></div>'+
      '<div class="f-row"><label for="f-tip">Trinkgeld</label><input id="f-tip" inputmode="decimal" autocomplete="off" placeholder="0,00 €" value="'+esc(inputVal(d.tip,1))+'"></div>'+
      '<div class="f-row"><label for="f-hours">Stunden</label><input id="f-hours" inputmode="decimal" autocomplete="off" placeholder="optional" value="'+esc(inputVal(d.hours))+'"></div>'+
    '</div>'+
    '<div class="group"><textarea id="f-note" rows="3" placeholder="Notiz (z. B. Konzert, Kabarett, lange Nacht …)">'+esc(d.note)+'</textarea></div>'+
    (e?'<div class="btn-wrap"><button class="btn red" data-sh-act="delete">Schicht löschen</button></div>':'');
  openSheet({
    title:e?'Bearbeiten':'Neue Schicht',body:body,mount:bindAmount,
    action:function(a){if(a==='delete')ask({title:'Schicht löschen?',msg:'Der Eintrag wird entfernt – auch in der Cloud.',ok:'Löschen',destructive:true}).then(function(y){if(!y)return;var now=Date.now();db.entries=db.entries.map(function(x){return x.id===e.id?{id:x.id,del:true,u:now}:x});save();closeSheet();render();toast('Gelöscht')})},
    save:function(el){
      var amount=parseNum(el.querySelector('#f-amount').value),tip=parseNum(el.querySelector('#f-tip').value);
      if(amount+tip<=0){shake(el.querySelector('.amount-big'));return}
      var now=Date.now(),dateV=el.querySelector('#f-date').value||todayStr();
      var rec={id:e?e.id:uid(),date:dateV,amount:amount,tip:tip,hours:parseNum(el.querySelector('#f-hours').value),note:el.querySelector('#f-note').value.trim(),created:e?e.created:now,u:now};
      if(e)db.entries=db.entries.map(function(x){return x.id===e.id?rec:x});else db.entries.push(rec);
      if(fromPlan)db.entries=db.entries.map(function(x){return x.id===fromPlan.id?{id:x.id,del:true,u:now}:x});
      if(save()){selDay=dateV;var dd=parseYmd(dateV);if(tab!=='cal'){cal={y:dd.getFullYear(),m:dd.getMonth()}}closeSheet();render();toast(e?'Geändert':'Gespeichert')}
    }
  });
}

/* ---------- Plan sheet ---------- */
function tomorrowStr(){var d=new Date();d.setDate(d.getDate()+1);return ymd(d)}
var REM_ON='<div class="rem-row"><span style="color:var(--green);display:flex">'+'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'+'</span><span class="txt">Erinnerung am Vormittag ist an</span></div>';
function openPlan(id,date){
  var x=id?findEntry(id):null;
  if(id&&!x)return;
  var d=x||{date:date||tomorrowStr(),time:'',note:''};
  var rem=pushOn()?REM_ON:'<div class="rem-row"><span style="color:var(--label2);display:flex">'+ic('bell')+'</span><span class="txt">Erinnerung am Vormittag ist aus</span><button type="button" data-sh-act="push">Einschalten</button></div>';
  var body='<div class="group">'+
      '<div class="f-row"><label for="f-date">Datum</label><input type="date" id="f-date" value="'+esc(d.date)+'"></div>'+
      '<div class="f-row"><label for="f-time">Beginn <span style="color:var(--label3)">(optional)</span></label><input type="time" id="f-time" value="'+esc(d.time)+'"></div>'+
    '</div>'+
    '<div class="group"><textarea id="f-note" rows="2" placeholder="Notiz (z. B. Konzert, Kabarett …)">'+esc(d.note)+'</textarea></div>'+
    '<div class="group" id="rem-group">'+rem+'</div>'+
    (x?'<div class="btn-wrap" style="margin-bottom:12px"><button class="btn tinted" data-sh-act="done">Verdienst eintragen</button></div><div class="btn-wrap"><button class="btn red" data-sh-act="delete">Plan löschen</button></div>':'');
  openSheet({
    title:x?'Geplante Schicht':'Schicht planen',body:body,
    action:function(a){
      if(a==='push'){enablePush(function(){var g=sheetEl.querySelector('#rem-group');if(g)g.innerHTML=REM_ON});return}
      if(a==='done'){openEntry(null,null,x);return}
      if(a==='delete')ask({title:'Plan löschen?',msg:'Die geplante Schicht und ihre Erinnerung werden entfernt.',ok:'Löschen',destructive:true}).then(function(y){if(!y)return;db.entries=db.entries.map(function(z){return z.id===x.id?{id:z.id,del:true,u:Date.now()}:z});save();closeSheet();render();toast('Gelöscht')});
    },
    save:function(el){
      var dateV=el.querySelector('#f-date').value;
      if(!dateV){shake(el.querySelector('#f-date').closest('.group'));return}
      var now=Date.now(),rec={id:x?x.id:uid(),kind:'plan',date:dateV,time:el.querySelector('#f-time').value||'',note:el.querySelector('#f-note').value.trim(),created:x?x.created:now,u:now};
      if(x)db.entries=db.entries.map(function(z){return z.id===x.id?rec:z});else db.entries.push(rec);
      if(save()){selDay=dateV;var dd=parseYmd(dateV);cal={y:dd.getFullYear(),m:dd.getMonth()};closeSheet();render();toast(x?'Geändert':'Geplant')}
    }
  });
}

/* ---------- Push reminders ---------- */
function pushSupported(){return'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function pushOn(){return!!db.prefs.push&&pushSupported()&&Notification.permission==='granted'}
function pushStatus(){if(!pushSupported())return'unsupported';if(Notification.permission==='denied')return'denied';return pushOn()?'on':'off'}
function b64ToBytes(b){var p='='.repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')),o=new Uint8Array(s.length);for(var i=0;i<s.length;i++)o[i]=s.charCodeAt(i);return o}
function postPush(body){return fetch('/api/push',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})}
function registerPush(){
  return navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription().then(function(s){
      if(s)return s;
      return fetch('/api/push?key=1',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
        if(!j.publicKey)throw new Error('no key');
        return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(j.publicKey)});
      });
    });
  }).then(function(sub){return postPush({id:sync.id,action:'subscribe',subscription:sub.toJSON()})})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);db.prefs.pushDay=todayStr();saveLocal()});
}
function enablePush(done){
  if(!pushSupported()){openInstall();return}
  // has to run straight from a tap - iOS only shows the permission prompt then
  Notification.requestPermission().then(function(p){
    if(p!=='granted'){toast('Mitteilungen nicht erlaubt',true);renderMore();return}
    return registerPush().then(function(){db.prefs.push=true;saveLocal();toast('Erinnerungen an');render();if(done)done()});
  }).catch(function(){toast('Einschalten hat nicht geklappt',true);renderMore()});
}
function disablePush(){
  db.prefs.push=false;saveLocal();render();toast('Erinnerungen aus');
  navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription()}).then(function(s){
    if(!s)return;
    postPush({id:sync.id,action:'unsubscribe',endpoint:s.endpoint}).catch(function(){});
    return s.unsubscribe();
  }).catch(function(){});
}
function testPush(){
  toast('Wird gesendet …');
  postPush({id:sync.id,action:'test'}).then(function(r){return r.json()}).then(function(j){
    if(j.ok)toast('Gesendet – schau aufs Handy');
    else registerPush().then(function(){toast('Neu verbunden – nochmal tippen')},function(){toast('Senden hat nicht geklappt',true)});
  }).catch(function(){toast('Offline – später nochmal',true)});
}
// keeps the server's copy of this phone's subscription fresh (once a day)
function refreshPush(){if(pushOn()&&db.prefs.pushDay!==todayStr())registerPush().catch(function(){})}

/* ---------- Sync code sheet ---------- */
function openLink(){
  openSheet({title:'Mit Code verbinden',saveLabel:'Verbinden',body:
    '<div class="group"><div class="f-row"><input id="f-code" class="code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx-xxxx" aria-label="Sync-Code"></div></div>'+
    '<div class="foot" style="margin-top:-12px">Gib den Sync-Code von deinem alten Handy ein. Die Schichten von dort werden mit denen auf diesem Handy zusammengeführt – es geht nix verloren.</div>',
    save:function(el){
      var inp=el.querySelector('#f-code'),c=normCode(inp.value);
      if(c.length<20||c.length>64){shake(inp.closest('.group'));return}
      closeSheet();
      if(c===sync.id){toast('Ist schon verbunden');return}
      sync.id=c;sync.dirty=true;sync.gen++;saveSync();renderMore();setState('pending');pull();toast('Verbunden');
      if(pushOn())registerPush().catch(function(){});
    }
  });
}

/* ---------- Install sheet ---------- */
function openInstall(){
  var shareIc='<span style="display:inline-flex;vertical-align:-4px;color:var(--blue)">'+ic('share')+'</span>';
  openSheet({title:'Zum Home-Bildschirm',noSave:true,body:
    '<div class="group"><ol class="steps">'+
      '<li><span class="no">1</span><span>Die Seite in <b>Safari</b> öffnen.</span></li>'+
      '<li><span class="no">2</span><span>Unten auf Teilen '+shareIc+' tippen.</span></li>'+
      '<li><span class="no">3</span><span>Runterscrollen und <b>„Zum Home-Bildschirm“</b> wählen.</span></li>'+
      '<li><span class="no">4</span><span>Oben rechts auf <b>Hinzufügen</b> – fertig.</span></li>'+
    '</ol></div>'+
    '<div class="foot" style="margin-top:-12px">Safari und die App am Home-Bildschirm haben getrennte Speicher. Wenn du schon in Safari was eingetragen hast: in der App unter „Mehr → Mit Code verbinden“ den Sync-Code aus Safari eingeben.</div>'});
}

/* ---------- Alert + toast ---------- */
function ask(o){
  return new Promise(function(res){
    var el=$('#alert');
    el.innerHTML='<div class="alert" role="alertdialog"><div class="alert-t">'+esc(o.title)+'</div><div class="alert-m">'+esc(o.msg||'')+'</div><div class="alert-b"><button data-r="0">'+(o.cancel||'Abbrechen')+'</button><button data-r="1" class="'+(o.destructive?'red':'strong')+'">'+esc(o.ok||'OK')+'</button></div></div>';
    el.classList.add('on');
    el.onclick=function(e){var b=e.target.closest('[data-r]');if(!b)return;el.classList.remove('on');el.onclick=null;res(b.dataset.r==='1')};
  });
}
var toastT;
function toast(msg,bad){var t=$('#toast');t.innerHTML=(bad?'':ic('check',2.6))+esc(msg);t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},1600)}

/* ---------- Export / import ---------- */
function shareOrDownload(name,text,type){
  var blob=new Blob([text],{type:type});
  try{
    var file=new File([blob],name,{type:type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(err){if(err&&err.name!=='AbortError')download(blob,name)});return}
  }catch(e){}
  download(blob,name);
}
function download(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
function exportJSON(){shareOrDownload('g-tracker-backup-'+todayStr()+'.json',JSON.stringify({app:'g-tracker',version:2,exported:new Date().toISOString(),entries:allLive()},null,1),'application/json')}
function exportCSV(){
  var q=function(s){s=String(s==null?'':s);return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  var n=function(v){return v?String(r2(v)).replace('.',','):''};
  var rows=[['Datum','Verdienst','Trinkgeld','Gesamt','Stunden','Notiz']];
  live().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}).forEach(function(e){rows.push([e.date,n(e.amount),n(e.tip),n(earned(e)),n(e.hours),e.note])});
  shareOrDownload('g-tracker-'+todayStr()+'.csv','﻿'+rows.map(function(r){return r.map(q).join(';')}).join('\r\n'),'text/csv');
}
$('#importFile').addEventListener('change',function(ev){
  var f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var d;try{d=JSON.parse(rd.result)}catch(e){toast('Datei ungültig',true);return}
    var inc=cleanList(d&&d.entries).filter(function(e){return!e.del});
    if(!inc.length){toast('Kein gültiges Backup',true);return}
    ask({title:'Backup laden?',msg:plural(inc.length,'Schicht','Schichten')+' im Backup. Sie werden mit deinen aktuellen Daten zusammengeführt – nix wird gelöscht.',ok:'Laden'}).then(function(y){
      if(!y)return;
      db.entries=mergeEntries(db.entries,inc);save();render();toast('Backup geladen');
    });
  };
  rd.readAsText(f);
});

/* ---------- Global actions ---------- */
document.addEventListener('click',function(ev){
  var tb=ev.target.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
  var t=ev.target.closest('[data-act]');if(!t||t.closest('#sheet'))return;
  var id=t.dataset.id;
  switch(t.dataset.act){
    case'new':openEntry(null,todayStr());break;
    case'edit':openEntry(id);break;
    case'prev':shiftMonth(-1);break;
    case'next':shiftMonth(1);break;
    case'today':goToday();break;
    case'day':selDay=t.dataset.d;renderCal();break;
    case'add-day':openEntry(null,(selDay&&selDay.slice(0,7)===cal.y+'-'+pad(cal.m+1))?selDay:todayStr());break;
    case'showall':showAll=!showAll;renderHome();break;
    case'hide-install':db.prefs.hideInstall=true;saveLocal();renderHome();break;
    case'install':openInstall();break;
    case'plan-new':openPlan(null,tomorrowStr());break;
    case'plan-day':openPlan(null,selDay);break;
    case'plan-edit':openPlan(id);break;
    case'plan-done':var pl=findEntry(id);if(pl)openEntry(null,null,pl);break;
    case'push-toggle':var st=pushStatus();if(st==='on')disablePush();else if(st==='unsupported')openInstall();else if(st==='denied')toast('In den iPhone-Einstellungen erlauben',true);else enablePush();break;
    case'push-test':testPush();break;
    case'gran':stat.g=t.dataset.v;stat.sel=null;renderStats();break;
    case'stat-sel':stat.sel=t.dataset.k;renderStats();break;
    case'wd-sel':stat.wd=+t.dataset.k;renderStats();break;
    case'stat-open':openStats(t.dataset.g,t.dataset.k);break;
    case'copy-code':
      var c=fmtCode(sync.id);
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(function(){toast('Code kopiert')},function(){toast(c)});else toast(c);
      break;
    case'link-code':openLink();break;
    case'sync-now':sync.dirty=true;sync.gen++;saveSync();push();break;
    case'export':if(!allLive().length){toast('Noch nix zum Sichern',true);break}exportJSON();break;
    case'import':$('#importFile').click();break;
    case'csv':if(!live().length){toast('Noch nix zum Exportieren',true);break}exportCSV();break;
    case'wipe':ask({title:'Alle Daten löschen?',msg:'Alle Schichten und Pläne werden gelöscht – auch in der Cloud. Das kann man nicht rückgängig machen.',ok:'Löschen',destructive:true}).then(function(y){if(!y)return;var now=Date.now();db.entries=db.entries.map(function(x){return x.del?x:{id:x.id,del:true,u:now}});save();render();toast('Alles gelöscht')});break;
  }
});
(function(){var sx=null,sy=0;var c=$('#cal');
c.addEventListener('touchstart',function(e){if(!e.target.closest('#cal-card')){sx=null;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
c.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)shiftMonth(dx<0?1:-1);sx=null},{passive:true})})();

var lastDay=todayStr();
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(sync.dirty)push();return}
  if(todayStr()!==lastDay){lastDay=todayStr();render()}
  if(Date.now()-lastPull>20000)pull();
});
window.addEventListener('online',function(){if(sync.dirty)push();else pull()});
window.addEventListener('pagehide',function(){if(sync.dirty&&navigator.sendBeacon){try{navigator.sendBeacon('/api/sync',new Blob([JSON.stringify({id:sync.id,entries:db.entries})],{type:'application/json'}))}catch(e){}}});

render();
pull();
setTimeout(refreshPush,3000);
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})}
})();
</script>
